; platformio_override.ini
; -----------------------------------------------------------------------------
; Build configuration for the Gledopto GL-C-618WL-4 Advanced (ESP32) running
; WLED 0.16.x with the Ceiling Mover usermod.
;
; Place this file in the ROOT of the WLED source tree (next to platform.ini).
; PlatformIO automatically merges *_override.ini. Then build the env:
;
;     pio run -e ceiling_glc618wl4
;
; The GL-C-618WL-4 Advanced is a plain ESP32 (WROOM) board with four level-
; shifted data outputs. WLED does not need a board-specific variant; it is a
; normal esp32dev target with the four outputs configured as four buses in the
; WLED LED-settings UI (see docs/INSTALL.md, stage 4/9). The default data GPIOs
; on this controller are 16, 3, 1, 4 -- VERIFY against your unit's silkscreen /
; Gledopto docs and set them in the UI; they are not compiled in.
; -----------------------------------------------------------------------------

[env:ceiling_glc618wl4]
extends = env:esp32dev
platform = ${esp32.platform}
board = esp32dev
board_build.partitions = ${esp32.default_partitions}

build_flags =
  ${common.build_flags}
  ${esp32.build_flags}
  ; ---- enable + configure the usermod --------------------------------------
  -D USERMOD_CEILING_MOVER
  -D CEILING_STRIP_LEN=864
  -D CEILING_NUM_LAYOUTS=5
  ; ---- installation sizing / behaviour -------------------------------------
  -D WLED_MAX_BUSSES=4            ; four physical outputs
  -D WLED_MAX_SEGMENTS=8          ; room for 2-block layouts + spares
  -D ABL_MILLIAMPS_DEFAULT=0      ; disable auto-brightness limiter (external PSU)
  ; SK6812 RGBW timing/order is selected per-bus in the UI (GRBW). Nothing to
  ; compile in for the LED type.

lib_deps = ${esp32.lib_deps}
board_build.f_flash = 80000000L
board_build.flash_mode = dio
